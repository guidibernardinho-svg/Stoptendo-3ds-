name: Build 3DS Homebrew

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build project
      run: make

    - name: Upload .3dsx
      uses: actions/upload-artifact@v4
      with:
        name: homebrew-3dsx
        path: "*.3dsx"

    - name: Upload .cia (se tiver)
      uses: actions/upload-artifact@v4
      with:
        name: homebrew-cia
        path: "*.cia"
        if-no-files-found: ignore
